name: Deploy games-web Container

on:
  push:
    branches: [main]
    paths:
      - "apps/games-web/**"
      - "packages/lib/**"
      - "packages/ui/**"
      - "packages/tailwind-config/**"
      - "packages/typescript-config/**"
      - "packages/eslint-config/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-games-web
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/games-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name lowercase
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/games-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Assets-first: upload this build's /_next/static to the persistent
      # storage zone BEFORE flipping the container. next.config `assetPrefix`
      # points browsers at static.th.gl (fronting this storage zone; Magic-
      # Container pull zones ignore OriginUrl-override edge rules, so a
      # same-origin route was not possible), which ACCUMULATES builds — so:
      #   - old builds' chunks keep resolving for open tabs and any edge
      #     still serving older HTML (purges can no longer 404 them: purge
      #     only evicts the edge; the storage origin still has the file);
      #   - the new build's chunks exist before any new HTML references
      #     them (no mid-rollout "new HTML, old origin" 404s).
      # Old builds are pruned after 60 days (well past the 1-day HTML TTL)
      # in the cleanup step at the end.
      # ------------------------------------------------------------------
      - name: Upload static assets to persistent storage (assets-first)
        if: vars.BUNNY_GAMES_WEB_APP_ID != ''
        env:
          API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          STORAGE_ZONE_ID: ${{ vars.BUNNY_GAMES_WEB_STATIC_STORAGE_ID || '1692632' }}
          STORAGE_ZONE_NAME: thgl-games-web-static
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # Extract the exact static output from the image we just pushed.
          docker pull -q "$IMAGE"
          CID=$(docker create "$IMAGE")
          docker cp "$CID:/app/apps/games-web/.next/static" ./static-out
          docker rm "$CID" >/dev/null

          # Storage password comes from the account API (no extra secret).
          STORAGE_PW=$(curl -fsS -H "AccessKey: $API_KEY" \
            "https://api.bunny.net/storagezone/$STORAGE_ZONE_ID" | jq -r '.Password')

          cd static-out
          find . -type f | sed 's|^\./||' > /tmp/static-files.txt
          TOTAL=$(wc -l < /tmp/static-files.txt)
          echo "Uploading $TOTAL static files to $STORAGE_ZONE_NAME..."

          upload_one() {
            local f="$1"
            curl -fsS -o /dev/null --retry 3 --retry-delay 2 -X PUT \
              -H "AccessKey: $STORAGE_PW" \
              --data-binary "@$f" \
              "https://storage.bunnycdn.com/$STORAGE_ZONE_NAME/_next/static/$f"
          }
          export -f upload_one
          export STORAGE_PW STORAGE_ZONE_NAME

          # Parallel upload; fail the deploy if any file can't be uploaded —
          # flipping the container without complete assets would reintroduce
          # the 404 class this exists to prevent.
          xargs -P 12 -I{} bash -c 'upload_one "$@"' _ {} < /tmp/static-files.txt
          echo "Static upload complete ($TOTAL files)"

      # Bunny's official BunnyWay/actions/container-update-image@main is a
      # single-shot fetch that throws an UnhandledPromiseRejection on 5xx
      # responses, which we've seen multiple times. Replace it with a curl
      # loop that retries on transient errors.
      - name: Update Magic Container
        if: vars.BUNNY_GAMES_WEB_APP_ID != ''
        env:
          APP_ID: ${{ vars.BUNNY_GAMES_WEB_APP_ID }}
          API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          CONTAINER_NAME: ${{ vars.BUNNY_GAMES_WEB_CONTAINER_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 1. Look up containerId by name
          APP_JSON=$(curl -fsS \
            -H "AccessKey: $API_KEY" \
            "https://api.bunny.net/mc/apps/$APP_ID")
          CONTAINER_ID=$(echo "$APP_JSON" \
            | jq -r --arg n "$CONTAINER_NAME" \
                '.containerTemplates[] | select(.name == $n) | .id')
          if [ -z "$CONTAINER_ID" ] || [ "$CONTAINER_ID" = "null" ]; then
            echo "Container '$CONTAINER_NAME' not found in app $APP_ID" >&2
            exit 1
          fi
          echo "Updating container '$CONTAINER_NAME' ($CONTAINER_ID) → $IMAGE_TAG"

          # 2. PATCH with retry on 5xx
          BODY=$(jq -nc \
            --arg id "$CONTAINER_ID" \
            --arg tag "$IMAGE_TAG" \
            '{id: $id, imageTag: $tag}')

          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
              -X PATCH \
              -H "AccessKey: $API_KEY" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://api.bunny.net/mc/apps/$APP_ID/containers/$CONTAINER_ID")

            if [ "$HTTP" = "200" ] || [ "$HTTP" = "204" ]; then
              echo "Update succeeded on attempt $attempt"
              break
            fi

            echo "Attempt $attempt: HTTP $HTTP"
            cat /tmp/resp.txt
            echo
            # Retry on 5xx and 429; bail on 4xx (other than 429)
            if [ "$HTTP" -lt 500 ] && [ "$HTTP" != "429" ]; then
              echo "Non-retryable error, giving up" >&2
              exit 1
            fi
            if [ "$attempt" = "5" ]; then
              echo "Update failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      # During a Magic Container rollout Bunny serves its own
      # "We're deploying your app!" placeholder page — and that page
      # carries Cache-Control: max-age=25600000 (~296 days). Any edge
      # that serves a request mid-rollout caches the placeholder for
      # ~10 months, since our app's s-maxage=60 never applies (the
      # response never came from our app). The only reliable fix is to
      # purge the pull zone AFTER the new container is actually live,
      # so every edge re-pulls the real app.
      - name: Wait for rollout and purge edge cache
        if: vars.BUNNY_GAMES_WEB_APP_ID != ''
        env:
          API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          # Pull zone id is not secret (it's in every CDN-PullZone
          # response header). Override via repo var if it ever changes.
          PULL_ZONE_ID: ${{ vars.BUNNY_GAMES_WEB_PULLZONE_ID || '5829962' }}
          PROBE_URL: "https://www.th.gl/"
        run: |
          set -uo pipefail

          purge() {
            curl -s -o /dev/null -w "purge HTTP %{http_code}\n" -X POST \
              -H "AccessKey: $API_KEY" \
              "https://api.bunny.net/pullzone/$PULL_ZONE_ID/purgeCache"
          }

          # Poll the live site until it stops returning the placeholder.
          # Require 3 consecutive clean responses (~30s stable) so we
          # don't purge while the rollout is still flapping between the
          # placeholder and the new container.
          clean=0
          live=0
          for i in $(seq 1 90); do
            body=$(curl -fsS --max-time 10 "$PROBE_URL" 2>/dev/null || true)
            if [ -n "$body" ] && ! printf '%s' "$body" | grep -q "We're deploying your app"; then
              clean=$((clean + 1))
              echo "Clean response $clean/3 (poll $i)"
              if [ "$clean" -ge 3 ]; then live=1; break; fi
            else
              clean=0
              echo "Still deploying or unreachable (poll $i)"
            fi
            sleep 10
          done

          if [ "$live" != "1" ]; then
            echo "::warning::App did not report healthy within ~15min; purging anyway"
          fi

          # Purge once now to evict any placeholder cached during rollout.
          purge
          # Magic Containers roll out per-region; a region that lagged
          # could re-cache the placeholder just after our first purge.
          # A second purge 60s later closes that window.
          sleep 60
          purge
          echo "Edge cache purged"

          # Build-skew straggler: even after the two purges above, an edge can
          # (re)cache the OLD build's HTML while the previous container instance
          # is still draining. Pages carry s-maxage=86400, so a straggler cached
          # after our last purge would stick for a DAY. (Old-build chunks keep
          # resolving thanks to the persistent static storage, so a straggler is
          # "old but working" — this purge is about freshness, not breakage.)
          # Instead of guessing a drain window, probe /api/build-id (no-store, so
          # every request reaches an origin instance) until only the new SHA
          # answers — 6 consecutive hits ≈ the old instance is gone — then purge.
          echo "Waiting for old container instance to drain (probing /api/build-id)..."
          consec=0
          drained=0
          for i in $(seq 1 60); do
            sha=$(curl -fsS --max-time 10 "${PROBE_URL}api/build-id?drain=${GITHUB_RUN_ID}-${i}" 2>/dev/null | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              consec=$((consec + 1))
              if [ "$consec" -ge 6 ]; then drained=1; break; fi
            else
              consec=0
            fi
            sleep 5
          done
          if [ "$drained" = "1" ]; then
            echo "Old instance drained (poll $i)"
          else
            echo "::warning::Drain not confirmed within ~5min (old build may still serve); purging anyway"
          fi
          purge
          echo "Drain-window purge done"

      # Retention: drop static files from builds that stopped being current
      # >60 days ago. Safe ordering: the upload step re-PUT every file of the
      # NEW build minutes ago (fresh LastChanged), and the deploy above
      # succeeded, so anything still older than 60d belongs to long-dead
      # builds — far past the 1-day page TTL any HTML could reference it from.
      # Best-effort: a prune failure must not fail the deploy.
      - name: Prune old static builds from storage
        if: vars.BUNNY_GAMES_WEB_APP_ID != ''
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.BUNNY_ACCOUNT_API_KEY }}
          STORAGE_ZONE_ID: ${{ vars.BUNNY_GAMES_WEB_STATIC_STORAGE_ID || '1692632' }}
          STORAGE_ZONE_NAME: thgl-games-web-static
          MAX_AGE_DAYS: "60"
        run: |
          set -uo pipefail
          STORAGE_PW=$(curl -fsS -H "AccessKey: $API_KEY" \
            "https://api.bunny.net/storagezone/$STORAGE_ZONE_ID" | jq -r '.Password')
          export STORAGE_PW
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone

          zone = os.environ["STORAGE_ZONE_NAME"]
          pw = os.environ["STORAGE_PW"]
          cutoff = datetime.now(timezone.utc) - timedelta(days=int(os.environ["MAX_AGE_DAYS"]))
          base = f"https://storage.bunnycdn.com/{zone}/"
          deleted = kept = 0

          def req(url, method="GET"):
              r = urllib.request.Request(url, method=method, headers={"AccessKey": pw})
              with urllib.request.urlopen(r, timeout=30) as resp:
                  return resp.read()

          def walk(path):
              global deleted, kept
              for e in json.loads(req(base + path)):
                  full = path + e["ObjectName"]
                  if e["IsDirectory"]:
                      walk(full + "/")
                      continue
                  # Bunny returns .NET-style timestamps (possibly 7-digit
                  # fractional seconds) — truncate to seconds for fromisoformat.
                  changed = datetime.fromisoformat(e["LastChanged"][:19]).replace(tzinfo=timezone.utc)
                  if changed < cutoff:
                      req(base + full, method="DELETE")
                      deleted += 1
                  else:
                      kept += 1

          walk("_next/static/")
          print(f"pruned {deleted} stale files, kept {kept}")
          EOF
