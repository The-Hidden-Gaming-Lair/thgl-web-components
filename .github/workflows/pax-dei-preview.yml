name: Pax Dei Preview

# DISCONTINUED (2026-09-08): the Pax Dei Overwolf app is no longer released —
# its KsDumper-based memory reading is unsupported, and Pax Dei tracking moved
# to the THGLApp companion (invite-only, see packages/lib/src/games.ts). The
# push trigger is removed so a manifest edit can never publish again; the code
# stays in apps/pax-dei-overwolf and this job can still be run by hand.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build Overwolf app
        run: bunx turbo run build --filter=pax-dei-overwolf...
      - name: Release Overwolf app
        env:
          OW_CLI_EMAIL: ${{ secrets.OW_CLI_EMAIL }}
          OW_CLI_API_KEY: ${{ secrets.OW_CLI_API_KEY }}
          PREVIEW_ACCESS_CHANNEL_ID: 879
        run: bunx turbo run release --filter=pax-dei-overwolf...
      - name: Promote tested build to production
        env:
          OW_CLI_EMAIL: ${{ secrets.OW_CLI_EMAIL }}
          OW_CLI_API_KEY: ${{ secrets.OW_CLI_API_KEY }}
          OW_APP_ID: kgfnjdoonhclpamjbhiohlkbolgdmepfaimbdfjo
          PREVIEW_ACCESS_CHANNEL_NAME: preview-access
        run: bunx turbo run promote --filter=pax-dei-overwolf
